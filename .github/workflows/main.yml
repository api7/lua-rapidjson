name: CI

on: [push]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        lua_version: [5.1, 5.2, 5.3, 5.4, luajit-2.0.5, luajit-2.1.0-beta3]

    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v1

    - uses: leafo/gh-actions-lua@v8.0.0
      with:
        luaVersion: ${{ matrix.lua_version }}

    - uses: leafo/gh-actions-luarocks@v4.0.0

    - name: Setup rocks depended
      run: |
        luarocks install luafilesystem
        luarocks install luautf8
        luarocks install busted

    - name: Build
      run: luarocks make

    - name: Check the built module is portable
      run: |
        # A build that leaks the runner's CPU features (-march=native, see
        # CMakeLists.txt) dies with SIGILL on older CPUs, and nothing else
        # catches it until the module is loaded on such a machine.
        if objdump -d build.luarocks/rapidjson.so | grep -qE '%[yz]mm|vfmadd|vpbroadcast'; then
            echo "rapidjson.so contains AVX instructions; the build is not portable" >&2
            exit 1
        fi

    - name: Test
      run: busted
